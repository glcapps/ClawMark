<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ClawMark Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <script src="editor/monaco-theme-clawmark.js"></script>
  <script src="editor/monaco-autocomplete-clawmark.js"></script>
  <script src="editor/monaco-clawmark.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="prose.css">
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    #container {
      height: calc(100vh - 4rem);
    }
    #output {
      white-space: pre-wrap;
    }
    #outputLogs, #outputCode {
      white-space: pre-wrap;
    }
  </style>
</head>
<body class="bg-gray-100">
  <header class="bg-gray-800 text-white text-sm px-4 py-2 flex justify-between items-center">
    <span class="font-mono text-lg">ClawMark Editor</span>
    <div class="flex items-center gap-2">
      <select id="protocolSelect" class="text-black text-sm px-2 py-1 rounded">
        <option value="ollama" selected>Ollama</option>
        <option value="openai">OpenAI</option>
        <option value="lmstudio">LMStudio</option>
      </select>
      <select id="modelSelect" class="text-black text-sm px-2 py-1 rounded">
        <option value="">(loading models...)</option>
      </select>
      <input id="endpointInput" class="text-black text-sm px-2 py-1 rounded" style="width: 20rem;" value="http://localhost:11434/api/generate" />
      <button id="resetEndpointButton" class="bg-blue-500 px-2 py-1 rounded text-white hover:bg-blue-600 text-sm">Reset</button>
      <button id="generateButton" class="bg-green-500 px-3 py-1 rounded hover:bg-green-600 disabled:bg-green-300 disabled:cursor-not-allowed">Generate</button>
      <button id="clippyButton" class="bg-purple-500 px-3 py-1 rounded hover:bg-purple-600 disabled:bg-purple-300 disabled:cursor-not-allowed">Clippy</button>
      <button id="buildButton" class="bg-yellow-500 px-3 py-1 rounded hover:bg-yellow-600 disabled:bg-yellow-300 disabled:cursor-not-allowed">Build</button>
      <button id="runButton" class="bg-teal-500 px-3 py-1 rounded hover:bg-teal-600 disabled:bg-teal-300 disabled:cursor-not-allowed">Run</button>
      <button id="stopButton" class="bg-red-500 px-3 py-1 rounded hover:bg-red-600 disabled:bg-red-300 disabled:cursor-not-allowed">Stop</button>
    </div>
  </header>
  <div class="grid grid-cols-3 h-[calc(100vh-4rem)]">
    <div id="container" class="col-span-1 border-r border-gray-300"></div>
    <div id="rendered" class="col-span-1 overflow-y-auto p-4 prose bg-white"></div>
    <div class="col-span-1 flex flex-col">
      <div id="outputLogs" class="flex-1 overflow-y-auto bg-black text-green-400 p-2 font-mono text-sm"></div>
      <div id="outputCode" class="flex-1 overflow-y-auto bg-gray-900 text-green-200 p-2 font-mono text-sm border-t border-gray-600"></div>
    </div>
  </div>

  <div id="v86shell" class="border-t border-gray-300 h-[40vh]">
    <div id="v86_container" class="w-full h-full"></div>
    <script src="https://copy.sh/v86/build/libv86.js"></script>
  </div>

  <script>
    // Endpoint persistence and Ollama model lookup, shared by the generate-button
    // handler and the page-load check further down.
    const defaultEndpoint = "http://localhost:11434/api/generate";
    const endpointInput = document.getElementById("endpointInput");
    const resetEndpointButton = document.getElementById("resetEndpointButton");

    const savedEndpoint = localStorage.getItem("clawmark-endpoint");
    if (savedEndpoint) endpointInput.value = savedEndpoint;
    resetEndpointButton.addEventListener("click", () => {
      endpointInput.value = defaultEndpoint;
      localStorage.setItem("clawmark-endpoint", defaultEndpoint);
    });

    async function fetchOllamaModels(endpointValue) {
      const endpointRoot = endpointValue.replace(/\/generate.*/, "");
      const data = await fetch(`${endpointRoot}/tags`).then(r => r.json());
      const models = Array.isArray(data.models) ? data.models : [];
      const hasCodeLlama = models.some(m => m.model.startsWith("codellama"));
      return { models, hasCodeLlama };
    }

    // Cargo.toml generation from the ClawMark spec's `# tools` section, so the
    // in-VM build matches whatever crates the spec (and thus the generated code)
    // actually declares, instead of a fixed serde+warp pair.
    const KNOWN_CRATE_DEPS = {
      serde: 'serde = { version = "1.0", features = ["derive"] }',
      serde_json: 'serde_json = "1"',
      tokio: 'tokio = { version = "1", features = ["full"] }',
      axum: 'axum = "0.7"',
      warp: 'warp = "0.3"',
      "actix-web": 'actix-web = "4"',
      hyper: 'hyper = { version = "1", features = ["full"] }',
      reqwest: 'reqwest = { version = "0.12", features = ["json"] }',
      anyhow: 'anyhow = "1"',
      thiserror: 'thiserror = "1"',
      uuid: 'uuid = { version = "1", features = ["v4"] }',
      chrono: 'chrono = "0.4"',
      sqlx: 'sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }'
    };

    function parseClawMarkTools(specText) {
      const lines = specText.split("\n");
      const toolsIndex = lines.findIndex(line => /^#\s*tools\s*$/i.test(line.trim()));
      if (toolsIndex === -1) return [];
      const tools = [];
      for (let i = toolsIndex + 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line.startsWith("#")) break;
        if (line) tools.push(line.toLowerCase());
      }
      return tools;
    }

    function buildCargoDependencies(tools) {
      // The generation prompt always instructs the model to use Serde, regardless
      // of whether the spec's `# tools` section mentions it.
      const names = new Set(["serde", ...tools]);
      return [...names]
        .map(name => KNOWN_CRATE_DEPS[name] || `${name} = "*"`)
        .join("\n");
    }

    // Strips code fences, a leading "Here's..." preamble, and anything the model
    // wrote past the `mod end {}` stop marker. Used for both the on-screen preview
    // and the source actually written into the VM, so they never diverge.
    function cleanGeneratedRustSource(responseText) {
      return responseText
        .replace(/```(?:rust)?/gi, "")
        .replace(/^Here.*?:/i, "")
        .replace(/mod end\s*{[^}]*}\s*[\s\S]*$/i, "mod end {}")
        .trim();
    }

    // Checks the cleaned response against the contract the generation prompt asks
    // for (start with use/fn/mod/struct, end with `mod end {}`), so a malformed or
    // truncated model response is surfaced in the log instead of silently reaching
    // the VM as a broken build.
    function validateGeneratedRustSource(cleanedSource) {
      if (!cleanedSource) {
        return { ok: false, warnings: ["Model returned an empty response."] };
      }
      const warnings = [];
      if (!/^\s*(use|fn|mod|struct)\b/.test(cleanedSource)) {
        warnings.push("Response doesn't start with use/fn/mod/struct as instructed — model may have added extra preamble.");
      }
      if (!/mod end\s*{\s*}/.test(cleanedSource)) {
        warnings.push("Response is missing the `mod end {}` terminator — output may be truncated.");
      }
      return { ok: true, warnings };
    }

    // Runs a command in the v86 shell and resolves with everything it printed
    // before a sentinel marker, so callers can capture cargo build/clippy output
    // instead of only seeing it scroll by in the log panel.
    let vmCaptureBuffer = null;
    let lastBuildOutput = "";
    let lastClippyOutput = "";
    let runningPid = null;

    function runVmCommand(command) {
      return new Promise(resolve => {
        vmCaptureBuffer = "";
        const sentinel = "__CLAWMARK_CMD_DONE__";
        const poll = setInterval(() => {
          const idx = vmCaptureBuffer.indexOf(sentinel);
          if (idx !== -1) {
            clearInterval(poll);
            const output = vmCaptureBuffer.slice(0, idx);
            vmCaptureBuffer = null;
            resolve(output);
          }
        }, 150);
        window.emulator.serial0_send(`${command}; echo "${sentinel}"\n`);
      });
    }

    function hasLikelyBuildError(output) {
      return /error(\[|:|\s)/i.test(output) || /warning:/i.test(output) || /check failed/i.test(output);
    }

    // Folds the previous cargo build/clippy output back into the next generation
    // request, so fixing a compile error doesn't require the user to manually
    // copy-paste cargo's output into the spec.
    function buildRegenerationFeedback() {
      const parts = [];
      if (lastBuildOutput && hasLikelyBuildError(lastBuildOutput)) {
        parts.push(`Previous \`cargo build\` output (fix the underlying issue):\n${lastBuildOutput.trim()}`);
      }
      if (lastClippyOutput && hasLikelyBuildError(lastClippyOutput)) {
        parts.push(`Previous \`cargo clippy\` output (fix these lints):\n${lastClippyOutput.trim()}`);
      }
      return parts.length ? `\n\n${parts.join("\n\n")}\n` : "";
    }
  </script>

  <script>
    require.config({ paths: { vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs" } });
    require(["vs/editor/editor.main"], function () {
      monaco.languages.register({ id: 'clawmark' });

      monaco.languages.setMonarchTokensProvider('clawmark', {
        tokenizer: {
          root: [
            [/^#\s.+/, 'keyword'],
            [/^##\s.+/, 'keyword'],
            [/^- .+/, 'string'],
            [/note:/i, 'type.identifier'],
            [/todo:/i, 'invalid'],
            [/\b(GET|POST|PUT|DELETE|PATCH)\b/, 'keyword'],
            [/\breturns:\b/, 'type'],
            [/\broot path prefix\b/, 'type.identifier'],
            [/\bis\b/, 'operator'],
            [/".*?"/, 'string'],
            [/\d+/, 'number']
          ]
        }
      });

      monaco.editor.defineTheme('clawmark-theme', {
        base: 'vs',
        inherit: true,
        rules: [
          { token: 'keyword', foreground: '1e88e5', fontStyle: 'bold' },
          { token: 'type.identifier', foreground: '43a047', fontStyle: 'italic' },
          { token: 'invalid', foreground: 'e53935', fontStyle: 'italic' },
          { token: 'string', foreground: '6a1b9a' },
          { token: 'number', foreground: '00897b' },
          { token: 'operator', foreground: '546e7a' }
        ],
        colors: {}
      });

      monaco.languages.registerCompletionItemProvider('clawmark', {
        triggerCharacters: [' ', ':', '/', '#'],
        provideCompletionItems: function () {
          return {
            suggestions: [
              { label: 'note:', kind: monaco.languages.CompletionItemKind.Keyword, insertText: 'note: ' },
              { label: 'todo:', kind: monaco.languages.CompletionItemKind.Keyword, insertText: 'todo: ' },
              { label: 'returns:', kind: monaco.languages.CompletionItemKind.Keyword, insertText: 'returns: ' },
              { label: '# routes', kind: monaco.languages.CompletionItemKind.Module, insertText: '# routes\n' },
              { label: 'GET /path', kind: monaco.languages.CompletionItemKind.Snippet, insertText: 'GET /${1:path}\n- returns: ${2:200 OK}' }
            ]
          };
        }
      });

      monaco.languages.setLanguageConfiguration('clawmark', {
        comments: { lineComment: "//" },
        brackets: [],
        autoClosingPairs: [
          { open: '"', close: '"' },
          { open: '`', close: '`' }
        ],
        surroundingPairs: [
          { open: '"', close: '"' },
          { open: '`', close: '`' }
        ]
      });

      monaco.editor.setTheme('clawmark-theme');

      if (window.registerClawmark) registerClawmark(monaco);
      if (window.registerClawmarkAutocomplete) registerClawmarkAutocomplete(monaco);
      if (window.defineClawmarkTheme) defineClawmarkTheme(monaco);

      const editor = monaco.editor.create(document.getElementById("container"), {
        value: "# hello_api module\n\n# routes\nroot path prefix: /api\n\nGET /hello\n- returns: 200 OK with JSON",
        language: "clawmark",
        automaticLayout: true
      });
      function waitForEmulatorReady() {
        return new Promise(resolve => {
          if (window.emulator) return resolve(window.emulator);
          const interval = setInterval(() => {
            if (window.emulator) {
              clearInterval(interval);
              resolve(window.emulator);
            }
          }, 100);
        });
      }

      const generateBtn = document.getElementById("generateButton");
      generateBtn.disabled = true;
      generateBtn.title = "Waiting for shell (v86) to initialize...";

      // Disable Clippy and Build buttons by default
      const clippyBtn = document.getElementById("clippyButton");
      clippyBtn.disabled = true;
      clippyBtn.title = "Generate code before using Clippy.";

      const buildBtn = document.getElementById("buildButton");
      buildBtn.disabled = true;
      buildBtn.title = "Generate code before building.";

      const runBtn = document.getElementById("runButton");
      runBtn.disabled = true;
      runBtn.title = "Build before running.";

      const stopBtn = document.getElementById("stopButton");
      stopBtn.disabled = true;
      stopBtn.title = "Nothing is running.";

      document.getElementById("generateButton").addEventListener("click", async () => {
        await waitForEmulatorReady();
        const prompt = editor.getValue();
        if (window.marked) {
          document.getElementById("rendered").innerHTML = window.marked.parse(prompt);
        } else {
          document.getElementById("rendered").innerHTML = "<p class='text-red-600'>Marked not loaded</p>";
        }
        const shell = document.getElementById("v86shell");
        const responseBox = document.getElementById("outputLogs");
        responseBox.textContent += "\n\n--- New Generation Request ---\n🧠 Contacting Ollama...\n";
        try {
          // Use endpointInput and defaultEndpoint consistently
          const selectedProtocol = document.getElementById("protocolSelect").value;
          const selectedModel = document.getElementById("modelSelect").value;
          // Store endpoint in localStorage
          localStorage.setItem("clawmark-endpoint", endpointInput.value);

          // The Ollama /tags endpoint and the codellama requirement are specific to the
          // Ollama protocol; OpenAI/LMStudio expose models differently, so only gate on it here.
          if (selectedProtocol === "ollama") {
            try {
              const { hasCodeLlama } = await fetchOllamaModels(endpointInput.value);
              if (!hasCodeLlama) {
                console.warn("⚠️ Model 'codellama' is not available at the specified endpoint.");
                responseBox.textContent = "⚠️ Model 'codellama' not found on Ollama. Please pull it using 'ollama pull codellama'.";
                return;
              }
            } catch (checkErr) {
              console.error("Failed to check model availability:", checkErr);
              responseBox.textContent += "❌ Error contacting Ollama to verify model availability.\n";
              return;
            }
          }

          const regenerationFeedback = buildRegenerationFeedback();
          if (regenerationFeedback) {
            responseBox.textContent += "\n📋 Including previous build/clippy errors as feedback for regeneration.\n";
          }
          lastBuildOutput = "";
          lastClippyOutput = "";

          const largeContext = await fetch("llm-context-large.md").then(r => r.text());

          let fetchPayload;
          let fetchURL = endpointInput.value;

          if (selectedProtocol === "ollama") {
            fetchPayload = {
              // Default model is "codellama:latest", but other tags like "codellama:13b" or "codellama:7b-code" are also valid.
              model: selectedModel || "codellama:latest",
              temperature: 0,
              top_p: 1,
              top_k: 1,
              prompt: `${largeContext}

You will be given a ClawMark specification written in simplified Markdown.
Your task is to generate idiomatic Rust code that fulfills its intent.

- The output must compile and pass Clippy without warnings.
- Use Result<T, E> over unwraps.
- Prefer async functions where I/O is implied.
- Use Serde and appropriate crates.
- Structure your code with idiomatic Rust best practices.

Respond with only valid Rust source code. Do not include:
- Markdown formatting
- Explanations
- Comments
- Code fences (\`\`\`)

Begin immediately with use, fn, mod, or struct.

Terminate the response with an empty \`mod end {}\` block. Do not include anything after that.

ClawMark input:

${prompt}${regenerationFeedback}`,
              stream: false
            };
          } else if (selectedProtocol === "openai" || selectedProtocol === "lmstudio") {
            fetchPayload = {
              model: selectedModel || "gpt-4",
              temperature: 0,
              top_p: 1,
              top_k: 1,
              messages: [
                {
                  role: "system",
                  content: `${largeContext}

You will be given a ClawMark specification written in simplified Markdown.
Your task is to generate idiomatic Rust code that fulfills its intent.

- The output must compile and pass Clippy without warnings.
- Use Result<T, E> over unwraps.
- Prefer async functions where I/O is implied.
- Use Serde and appropriate crates.
- Structure your code with idiomatic Rust best practices.

Respond with only valid Rust source code. Do not include:
- Markdown formatting
- Explanations
- Comments
- Code fences (\`\`\`)

Begin immediately with use, fn, mod, or struct.

Terminate the response with an empty \`mod end {}\` block. Do not include anything after that.`
                },
                {
                  role: "user",
                  content: `${prompt}${regenerationFeedback}`
                }
              ]
            };
            if (!fetchURL.includes("/v1/chat/completions")) {
              fetchURL = fetchURL.replace(/\/?$/, "/v1/chat/completions");
            }
          }

          const result = await fetch(fetchURL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(fetchPayload)
          }).then(r => r.json());

          const responseText = result.choices && result.choices[0] && result.choices[0].message && result.choices[0].message.content
            ? result.choices[0].message.content
            : (result.response || "");

          const cleanedSource = cleanGeneratedRustSource(responseText);
          document.getElementById("outputCode").textContent = cleanedSource || "(no response)";

          const validation = validateGeneratedRustSource(cleanedSource);
          if (!validation.ok) {
            responseBox.textContent += `\n❌ Generation failed: ${validation.warnings.join(" ")}\n`;
            return;
          }
          validation.warnings.forEach(w => {
            responseBox.textContent += `\n⚠️ ${w}\n`;
          });

          responseBox.textContent += "\n💡 Hydrating ClawMark code for virtual shell.";

          // Enable Clippy and Build buttons after successful generation
          clippyBtn.disabled = false;
          clippyBtn.title = "";
          buildBtn.disabled = false;
          buildBtn.title = "";

          // New code invalidates any previous build/running process.
          runBtn.disabled = true;
          runBtn.title = "Build before running.";
          if (runningPid) {
            window.emulator.serial0_send(`kill ${runningPid}\n`);
            runningPid = null;
          }
          stopBtn.disabled = true;
          stopBtn.title = "Nothing is running.";

          if (!shell.classList.contains("hidden") && typeof emulator !== "undefined") {
            const codeLines = cleanedSource
              .replace(/\\/g, "\\\\")
              .replace(/"/g, '\\"')
              .split("\n")
              .map(line => `echo "${line}" >> /root/src/main.rs`)
              .join("\n");

            const tools = parseClawMarkTools(prompt);
            const dependencies = buildCargoDependencies(tools);
            const cargoToml = `
[package]
name = "clawmark_gen"
version = "0.1.0"
edition = "2021"

[dependencies]
${dependencies}
    `.trim().split("\n").map(line => `echo "${line.replace(/"/g, '\\"')}" >> /root/Cargo.toml`).join("\n");

            const fullScript = `
mkdir -p /root/src
rm -f /root/src/main.rs /root/Cargo.toml
${codeLines}
${cargoToml}
`.trim();

            emulator.serial0_send(fullScript + "\n");
          }
        } catch (e) {
          responseBox.textContent = `Error: ${e.message}`;
        }
      });

      // Initialize v86 shell automatically on page load
      const shell = document.getElementById("v86shell");
      const emulator = new V86({
        wasm_path: "v86/v86.wasm",
        memory_size: 256 * 1024 * 1024,
        vga_memory_size: 8 * 1024 * 1024,
        screen_container: document.getElementById("v86_container"),
        bios: { url: "v86/seabios.bin" },
        vga_bios: { url: "v86/vgabios.bin" },
        bzimage: { url: "v86/vmlinuz" },
        initrd: { url: "v86/initrd" },
        filesystem: { basefs: "v86/fs.json" },
        autostart: true,
        cmdline: "rw root=host9p rootfstype=9p rootflags=trans=virtio,cache=loose"
      });

      emulator.add_listener("serial0-output-char", char => {
        document.getElementById("outputLogs").textContent += char;
        if (vmCaptureBuffer !== null) vmCaptureBuffer += char;
      });

      window.emulator = emulator;
      generateBtn.disabled = false;
      generateBtn.title = "";
    });

    // Add build, clippy, run and stop button event listeners
    const runBtnHandle = document.getElementById("runButton");
    const stopBtnHandle = document.getElementById("stopButton");

    document.getElementById("buildButton").addEventListener("click", async () => {
      if (window.emulator) {
        document.getElementById("outputLogs").textContent += "\n🚧 Building /root/src/main.rs via cargo...\n";
        lastBuildOutput = await runVmCommand("cargo build --manifest-path=/root/Cargo.toml");
        if (hasLikelyBuildError(lastBuildOutput)) {
          runBtnHandle.disabled = true;
          runBtnHandle.title = "Fix build errors before running.";
        } else {
          runBtnHandle.disabled = false;
          runBtnHandle.title = "";
        }
      }
    });

    document.getElementById("clippyButton").addEventListener("click", async () => {
      if (window.emulator) {
        document.getElementById("outputLogs").textContent += "\n🔍 Running cargo clippy...\n";
        lastClippyOutput = await runVmCommand("cargo clippy --manifest-path=/root/Cargo.toml");
      }
    });

    runBtnHandle.addEventListener("click", async () => {
      if (!window.emulator || runningPid) return;
      document.getElementById("outputLogs").textContent += "\n▶️ Running /root/target/debug/clawmark_gen...\n";
      const output = await runVmCommand("/root/target/debug/clawmark_gen & echo RUN_PID:$!");
      const match = output.match(/RUN_PID:(\d+)/);
      if (match) {
        runningPid = match[1];
        stopBtnHandle.disabled = false;
        stopBtnHandle.title = "";
      } else {
        document.getElementById("outputLogs").textContent += "\n❌ Could not determine the process id — is the binary built?\n";
      }
    });

    stopBtnHandle.addEventListener("click", async () => {
      if (!window.emulator || !runningPid) return;
      document.getElementById("outputLogs").textContent += `\n⏹️ Stopping process ${runningPid}...\n`;
      await runVmCommand(`kill ${runningPid}`);
      runningPid = null;
      stopBtnHandle.disabled = true;
      stopBtnHandle.title = "Nothing is running.";
    });
  </script>
</body>
  <script>
    (async () => {
      if (!window.marked) {
        const module = await import("https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/lib/marked.esm.min.js");
        window.marked = module.marked;
      }
    })();
  </script>
  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      const responseBox = document.getElementById("outputLogs");

      // Improved logging for Ollama/model check
      responseBox.textContent += "🔍 Verifying Ollama access...\n";
      try {
        const { models, hasCodeLlama } = await fetchOllamaModels(endpointInput.value);
        responseBox.textContent += "✅ Ollama found.\n";
        responseBox.textContent += "🔍 Verifying Ollama models...\n";
        if (hasCodeLlama) {
          responseBox.textContent += "✅ codellama model found at load.\n";
        } else {
          responseBox.textContent += "⚠️ codellama model not found. Please run 'ollama pull codellama'.\n";
        }
        // Populate the modelSelect dropdown
        const modelSelect = document.getElementById("modelSelect");
        modelSelect.innerHTML = "";
        models.forEach(m => {
          const opt = document.createElement("option");
          opt.value = m.model;
          opt.textContent = m.model;
          modelSelect.appendChild(opt);
        });
        responseBox.textContent += "🔍 Checking on Rust services virtual machine...\n";
      } catch (e) {
        responseBox.textContent += "❌ Failed to contact Ollama on page load.\n";
        responseBox.textContent += "🔍 Checking on Rust services virtual machine...\n";
        console.error("Error verifying codellama on load:", e);
      }
    });
  </script>
</html>
